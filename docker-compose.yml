services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: atc
      POSTGRES_PASSWORD: atc
      POSTGRES_DB: atcmonitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://atc:atc@db:5432/atcmonitor
    depends_on:
      - db
    volumes:
      - ./backend:/app/backend

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
